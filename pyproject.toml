[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-trace-compact"
dynamic = ["version"]  # defined elsewhere
description = "Massively compress Python trace files into dense metrics, ranges, or structural summaries."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT for Code / CC BY-NC-ND 4.0 for Documentation" }
authors = [
    { name = "Andrew Kingdom" }
]
keywords = [
    "trace",
    "profiling",
    "debugging",
    "coverage",
    "optimization"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/akingdom/python_trace_compact"
Repository = "https://github.com/akingdom/python_trace_compact"
Issues = "https://github.com/akingdom/python_trace_compact/issues"

[project.optional-dependencies]
all = []

[project.scripts]
python-trace-compact = "python_trace_compact.main:process_trace"

[tool.setuptools.dynamic]
version = {attr = "python_trace_compact.__version__"}  # attribute in __init__

[tool.setuptools.packages.find]
where = ["src"]
